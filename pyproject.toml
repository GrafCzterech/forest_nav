[tool.black]
line-length = 80
include = '\.pyi?$'

[project]
name = "nfl_lab_bridge"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "forest-gen @ git+ssh://git@github.com/GrafCzterech/forest-gen.git@main"
]

[tool.setuptools]
packages = ["project"]
package-dir = { "" = "src" }

[project.optional-dependencies]
dev = ["black"]
test = ["unittest"]

[tool.pyproject2conda.dependencies]
forest-gen = {pip = true}
black = {skip = true, pip = true}
unittest = {skip = true, pip = true}

[project.urls]
Repository = "https://github.com/GrafCzterech/nfl-lab-bridge"
